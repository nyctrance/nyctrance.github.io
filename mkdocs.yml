site_name: NYC Trance
site_description: A little social club for those around the big city with open minds
site_author: nyctrance
site_url: https://nyctrance.github.io/
repo_url: https://github.com/nyctrance/nyctrance.github.io
repo_name: nyctrance/nyctrance.github.io

theme:
  name: material
  custom_dir: overrides
  language: en
  logo: assets/spiral.gif
  favicon: assets/spiral.gif
  palette:
    # Day / warm light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Nocturnal / slate mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.path
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/pagination.js

markdown_extensions:
  - md_in_html
  - admonition_headings
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["docs", "."]
  - pymdownx.magiclink
  - attr_list
  - def_list
  - sane_lists
  - tables
  - footnotes
  - toc:
      permalink: true
      toc_depth: 4

plugins:
  - search
  - blog:
      blog_dir: events
      blog_toc: true
      post_url_format: "{slug}"
      archive: false

nav:
  - Home: index.md
  - Consent: consent.md
  - Events: events/index.md

not_in_nav: |
  main.md
  drafts/*

